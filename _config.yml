\# Sitemap settings
defaults:
  \- scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed

\# -----------------------------------------------------------------------------
\# Jekyll Minifier
\# -----------------------------------------------------------------------------

jekyll-minifier:
  compress\_javascript: false # set to false since we are using terser as the js minifier
  \# CSS is already minified upstream (Tailwind build ships tailwind.css; main.scss is compiled
  \# with sass \`style: compressed\`). Re-minifying via cssminify2 mangles Tailwind v4 spacing
  \# tokens inside calc(), turning \`var(--spacing)\` into the invalid \`var( -  - spacing)\` and
  \# breaking every spacing/positioning utility (e.g. .fixed-top -> broken navbar). Disable it.
  compress\_css: false
  \# JS minification is delegated to jekyll-terser (compress\_javascript above is false).
  exclude: ["robots.txt"]

\# -----------------------------------------------------------------------------
\# Terser
\# -----------------------------------------------------------------------------

terser:
  compress:
    drop\_console: true

\# -----------------------------------------------------------------------------
\# Jekyll Archives
\# -----------------------------------------------------------------------------

jekyll-archives:
  posts:
    enabled: [year, tags, categories] # enables year, tag and category archives (remove if you need to disable one of them).
    permalinks:
      year: "/blog/\:year/"
      tags: "/blog/\:type/\:name/"
      categories: "/blog/\:type/\:name/"
  books:
    enabled: [year, tags, categories] # enables year, tag and category archives (remove if you need to disable one of them).

display\_tags: ["formatting", "images", "links", "math", "code", "blockquotes"] # these tags will be displayed on the front page of your blog
display\_categories: ["external-services"] # these categories will be displayed on the front page of your blog

\# -----------------------------------------------------------------------------
\# Jekyll Scholar
\# -----------------------------------------------------------------------------

scholar:
  last\_name: [Einstein]
  first\_name: [Albert, A.]

  style: apa
  locale: en

  source: /\_bibliography/
  bibliography: papers.bib
  bibliography\_template: bib
  \# Note: if you have latex math in your bibtex, the latex filter
  \# preprocessing may conflict with MathJAX if the latter is enabled.
  \# See [https://github.com/alshedivat/al-folio/issues/357](https://github.com/alshedivat/al-folio/issues/357).
  bibtex\_filters: [latex, smallcaps, superscript]

  replace\_strings: true
  join\_strings: true

  details\_dir: bibliography
  details\_link: Details

  query: "@\*"
  group\_by: year
  group\_order: descending

\# Display different badges withs stats for your publications
\# Customize badge behavior in \_layouts/bib.liquid
enable\_publication\_badges:
  altmetric: true # Altmetric badge (Customization options: [https://badge-docs.altmetric.com/index.html](https://badge-docs.altmetric.com/index.html))
  dimensions: true # Dimensions badge (Customization options: [https://badge.dimensions.ai/](https://badge.dimensions.ai/))
  google\_scholar: true # Google Scholar badge ([https://scholar.google.com/intl/en/scholar/citations.html](https://scholar.google.com/intl/en/scholar/citations.html))
  inspirehep: true # Inspire HEP badge ([https://help.inspirehep.net/knowledge-base/citation-metrics/](https://help.inspirehep.net/knowledge-base/citation-metrics/))

\# Filter out certain bibtex entry keywords used internally from the bib output
filtered\_bibtex\_keywords:
  [
    abbr,
    abstract,
    additional\_info,
    altmetric,
    annotation,
    arxiv,
    award,
    award\_name,
    bibtex\_show,
    blog,
    code,
    dimensions,
    eprint,
    google\_scholar\_id,
    hal,
    html,
    inspirehep\_id,
    pdf,
    pmid,
    poster,
    preview,
    selected,
    slides,
    supp,
    video,
    website,
  ]

\# Maximum number of authors to be shown for each publication (more authors are visible on click)
max\_author\_limit: 3 # leave blank to always show all authors
more\_authors\_animation\_delay: 10 # more authors are revealed on click using animation; smaller delay means faster animation

\# Enables publication thumbnails. If disabled, none of the publications will display thumbnails, even if specified in the bib entry.
enable\_publication\_thumbnails: true

\# -----------------------------------------------------------------------------
\# Jekyll Link Attributes
\# -----------------------------------------------------------------------------

\# These are the defaults
external\_links:
  enabled: true
  rel: external nofollow noopener
  target: \_blank
  exclude:

\# -----------------------------------------------------------------------------
\# Responsive WebP Images
\# -----------------------------------------------------------------------------

\# MAKE SURE imagemagick is installed and on your PATH before enabling imagemagick. In a terminal, run:
\#   convert -version
imagemagick:
  enabled: true # enables responsive images for your site (recommended, see [https://github.com/alshedivat/al-folio/issues/537](https://github.com/alshedivat/al-folio/issues/537))
  widths:
    \- 480
    \- 800
    \- 1400
  input\_directories:
    \- assets/img/
  input\_formats:
    \- ".jpg"
    \- ".jpeg"
    \- ".png"
    \- ".tiff"
    \- ".gif"
  output\_formats:
    webp: "-auto-orient -quality 85"

\# Lazy loading images
\#   If you enable lazy loading, all images will add the loading="lazy" attribute.
\#   This will make your site load faster, but it may not be supported in all browsers.
\#   You can also set loading="" to other values for specific images to override the default behavior.
\#   Options: "auto", "eager", "lazy"
\#   See [https://web.dev/browser-level-image-lazy-loading/](https://web.dev/browser-level-image-lazy-loading/) for more information.
lazy\_loading\_images: true # enables lazy loading of images (recommended)

\# -----------------------------------------------------------------------------
\# Optional Features
\# -----------------------------------------------------------------------------

enable\_google\_verification: false # enables google site verification
enable\_bing\_verification: false # enables bing site verification
enable\_cookie\_consent: false # enables GDPR-compliant cookie consent dialog ([https://github.com/orestbida/cookieconsent](https://github.com/orestbida/cookieconsent))
enable\_masonry: true # enables automatic project cards arrangement
enable\_math: true # enables math typesetting (uses MathJax)
enable\_tooltips: false # enables automatic tooltip links generated for each section titles on pages and posts
enable\_darkmode: true # enables switching between light/dark modes
enable\_navbar\_social: false # enables displaying social links in the navbar on the about page
enable\_project\_categories: true # enables categorization of projects into multiple categories
enable\_medium\_zoom: true # enables image zoom feature (as on medium.com)
enable\_progressbar: true # enables a horizontal progress bar linked to the vertical scroll position
enable\_video\_embedding: false # enables video embedding for bibtex entries. If false, the button opens the video link in a new window.

