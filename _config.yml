# -----------------------------------------------------------------------------
\# Site settings
\# -----------------------------------------------------------------------------

title: blank # the website title (if blank, full name will be used instead)
first\_name: Md.
middle\_name: Shakil
last\_name: Ahmed
contact\_note: >
  You can even add a little note about which of these is the best way to reach you.
description: > # the ">" symbol means to ignore newlines until "footer\_text:"
  A simple, whitespace theme for academics. Based on [\*folio]\([https://github.com/bogoli/-folio](https://github.com/bogoli/-folio)) design.
footer\_text: >
  Powered by \<a href="[https://jekyllrb.com/](https://jekyllrb.com/)" target="\_blank">Jekyll\</a> with \<a href="[https://github.com/alshedivat/al-folio](https://github.com/alshedivat/al-folio)">al-folio\</a> theme.
  Hosted by \<a href="[https://pages.github.com/](https://pages.github.com/)" target="\_blank">GitHub Pages\</a>.
  Photos from \<a href="[https://unsplash.com](https://unsplash.com)" target="\_blank">Unsplash\</a>.
keywords: jekyll, jekyll-theme, academic-website, portfolio-website # add your own keywords or leave empty
lang: en # the language of your site (for example: en, fr, cn, ru, etc.)
icon: ⚛️ # the emoji used as the favicon (alternatively, provide image name in /assets/img/)
apple\_touch\_icon: # image name in /assets/img/ (or a rooted path / absolute URL) used for iOS home-screen bookmarks; needs a real 180x180 PNG, since Safari ignores the emoji favicon above. Left empty, iOS falls back to a screenshot of the page.

url: [https://shakil2022.github.io](https://shakil2022.github.io) # the base hostname & protocol for your site
baseurl: /Shakil\_Portfolio # the subpath of your site, e.g. /blog/. Leave blank for root
last\_updated: false # set to true if you want to display last updated in the footer
impressum\_path: # set to path to include impressum link in the footer, use the same path as permalink in a page, helps to conform with EU GDPR
back\_to\_top: true # set to false to disable the back to top button

\# -----------------------------------------------------------------------------
\# Theme
\# -----------------------------------------------------------------------------

\# repo color theme
repo\_theme\_light: default # [https://github.com/stats-organization/github-stats-extended/blob/master/packages/core/src/themes/README.md](https://github.com/stats-organization/github-stats-extended/blob/master/packages/core/src/themes/README.md)
repo\_theme\_dark: dark # [https://github.com/stats-organization/github-stats-extended/blob/master/packages/core/src/themes/README.md](https://github.com/stats-organization/github-stats-extended/blob/master/packages/core/src/themes/README.md)
\# Off by default: addresses are then split at build time so the HTML contains no
\# \`user\@host\` and no \`mailto:\` for harvesters to scrape, and clicking one copies
\# it to the clipboard instead of opening a mail client.
\# See "Protecting email addresses from scrapers" in docs/CUSTOMIZE.md.
protect\_email: false

\# Off by default: the free public github-profile-trophy instance is disabled
\# (its Vercel deployment answers HTTP 402 / DEPLOYMENT\_DISABLED), so every trophy
\# image 404s. The project itself is still open source and free — self-host it and
\# point external\_services.github\_profile\_trophy\_url at your instance, then set
\# enabled: true. See docs/CUSTOMIZE.md.
repo\_trophies:
  enabled: false
  theme\_light: flat # [https://github.com/ryo-ma/github-profile-trophy](https://github.com/ryo-ma/github-profile-trophy)
  theme\_dark: gitdimmed # [https://github.com/ryo-ma/github-profile-trophy](https://github.com/ryo-ma/github-profile-trophy)

\# External service URLs for repository page
\# To use a different instance or service for displaying GitHub stats and trophies,
\# update these URLs. These are used in the repository templates.
external\_services:
  github\_readme\_stats\_url: [https://github-stats-extended.vercel.app](https://github-stats-extended.vercel.app)
  github\_profile\_trophy\_url: [https://github-profile-trophy.vercel.app](https://github-profile-trophy.vercel.app)

\# -----------------------------------------------------------------------------
\# al-folio API (v1.x)
\# -----------------------------------------------------------------------------

al\_folio:
  api\_version: 1
  style\_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css\_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow\_remote\_loader: false
  features:
    cv:
      enabled: true
    distill:
      enabled: true
  compat:
    bootstrap:
      enabled: false
      support\_window: v1.0-v1.2
      deprecates\_in: v1.3
      removed\_in: v2.0
  upgrade:
    channel: stable
    auto\_apply\_safe\_fixes: false

\# -----------------------------------------------------------------------------
\# RSS Feed
\# -----------------------------------------------------------------------------
\# will use title and url fields
\# Take a look to [https://github.com/jekyll/jekyll-feed](https://github.com/jekyll/jekyll-feed) for more customization

\# -----------------------------------------------------------------------------
\# Layout
\# -----------------------------------------------------------------------------

navbar\_fixed: true
footer\_fixed: true
search\_enabled: true
socials\_in\_search: true
posts\_in\_search: true
bib\_search: true

\# Dimensions
max\_width: 930px

\# -----------------------------------------------------------------------------
\# Open Graph & Schema.org
\# -----------------------------------------------------------------------------
\# Display links to the page with a preview object on social media.
\# see [https://schema.org/docs/faq.html](https://schema.org/docs/faq.html) for more information
serve\_og\_meta: false # Include Open Graph meta tags in the HTML head
serve\_schema\_org: false # Include Schema.org in the HTML head
og\_image: # The site-wide (default for all links) Open Graph preview image

\# -----------------------------------------------------------------------------
\# Analytics and search engine verification
\# -----------------------------------------------------------------------------

analytics:
  \# For Google Analytics, see [https://support.google.com/analytics/answer/10447272?hl=en&ref\_topic=14088998&sjid=5129943941510317771-SA#zippy=%2Cgoogle-sites](https://support.google.com/analytics/answer/10447272?hl=en\&ref_topic=14088998\&sjid=5129943941510317771-SA#zippy=%2Cgoogle-sites)
  \# and follow the instructions for Google Sites. You will need to create a Google Analytics property and copy the Google tag ID.
  google: # your Google Analytics measurement ID (format: G-XXXXXXXXXX)
  cronitor: # cronitor RUM analytics site ID (format: XXXXXXXXX)
  pirsch: # your Pirsch analytics site ID (length 32 characters)
  openpanel: # your Openpanel analytics client ID (format: XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX)
  cloudflare: # your Cloudflare Web Analytics beacon token (32 hex characters)
enable\_simple\_analytics: false # Simple Analytics identifies a site by its domain, so it has no ID to set above

\# For Google Search Console, see [https://support.google.com/webmasters/answer/9008080?hl=en#meta\_tag\_verification&zippy=%2Chtml-tag](https://support.google.com/webmasters/answer/9008080?hl=en#meta_tag_verification\&zippy=%2Chtml-tag)
google\_site\_verification: # your google-site-verification ID (Google Search Console)
bing\_site\_verification: # out your bing-site-verification ID (Bing Webmaster)

\# -----------------------------------------------------------------------------
\# Blog
\# -----------------------------------------------------------------------------

blog\_name: al-folio # blog\_name will be displayed in your blog page
blog\_description: a simple whitespace theme for academics
permalink: /blog/\:year/\:title/
lsi: false # produce an index for related posts

\# Pagination
pagination:
  enabled: true

related\_blog\_posts:
  enabled: true
  max\_related: 5

\# Giscus comments (RECOMMENDED)
\# Follow instructions on [https://giscus.app/](https://giscus.app/) to setup for your repo to fill out the information below.
giscus:
  repo: # \<your-github-user-name>/\<your-github-repo-name>
  repo\_id: # leave empty or specify your repo\_id (see [https://giscus.app/](https://giscus.app/))
  category: Comments # name of the category under which discussions will be created
  category\_id: # leave empty or specify your category\_id (see [https://giscus.app/](https://giscus.app/))
  mapping: title # identify discussions by post title
  strict: 1 # use strict identification mode
  reactions\_enabled: 1 # enable (1) or disable (0) emoji reactions
  input\_position: bottom # whether to display input form below (bottom) or above (top) the comments
  dark\_theme: dark # name of the dark color scheme (preferred works well with al-folio dark mode)
  light\_theme: light # name of the light color scheme (preferred works well with al-folio light mode)
  emit\_metadata: 0
  lang: en

\# Disqus comments (DEPRECATED)
disqus\_shortname: al-folio # put your disqus shortname
\# [https://help.disqus.com/en/articles/1717111-what-s-a-shortname](https://help.disqus.com/en/articles/1717111-what-s-a-shortname)

\# External sources.
\# If you have blog posts published on medium.com or other external sources,
\# you can display them in your blog by adding a link to the RSS feed.
\# Optional: Set default categories and tags for posts from each source.
external\_sources:
  \- name: medium.com
    rss\_url: [https://medium.com/@al-folio/feed](https://medium.com/@al-folio/feed)
    categories: [external-posts]
    tags: [medium]
  \- name: Google Blog
    posts:
      \- url: [https://blog.google/technology/ai/google-gemini-update-flash-ai-assistant-io-2024/](https://blog.google/technology/ai/google-gemini-update-flash-ai-assistant-io-2024/)
        published\_date: 2024-05-14
    categories: [external-posts]
    tags: [google]

\# -----------------------------------------------------------------------------
\# Newsletter
\# -----------------------------------------------------------------------------

newsletter:
  enabled: false
  endpoint: # your loops endpoint (e.g., [https://app.loops.so/api/newsletter-form/YOUR-ENDPOINT](https://app.loops.so/api/newsletter-form/YOUR-ENDPOINT))
  \# [https://loops.so/docs/forms/custom-form](https://loops.so/docs/forms/custom-form)

\# -----------------------------------------------------------------------------
\# Collections
\# -----------------------------------------------------------------------------

collections:
  books:
    output: true
  news:
    defaults:
      layout: post
    output: true
  projects:
    output: true
  teachings:
    output: true

\# -----------------------------------------------------------------------------
\# Jekyll settings
\# -----------------------------------------------------------------------------

\# Markdown and syntax highlight
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax\_highlighter\_opts:
    css\_class: "highlight"
    span:
      line\_numbers: false
    block:
      line\_numbers: false
      start\_line: 1

